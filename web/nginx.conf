server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # __API_ORIGIN__ and __OIDC_ORIGIN__ are filled in at image build time (web/Dockerfile). The browser talks to PhotonID directly (discovery, token,
    # sign-out), so its origin must be allowed. Styles may be inline (React's style attributes); scripts may not.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' __API_ORIGIN__ __OIDC_ORIGIN__ __DIRECTORY_ORIGIN__; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";

    # A path that is not a file goes to index.html, so the router handles it. index.html itself is never cached: it names each build's hashed assets.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # A location with its own add_header drops the server's, so the policy is repeated here (audit VOX-A-12).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
