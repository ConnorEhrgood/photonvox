# vox-agent on the live engine (CT 600): /etc/systemd/system/vox-agent.service.d/live.conf. An adopted engine (decision 32) only has its
# cache cleared and its post-publish checks run (VOX_AGENT_OPERATIONS=status,cache/delete,check in /etc/vox-agent.env), so the only place it
# may write is FusionPBX's cache; everything else (FreeSWITCH's configuration, scripts, storage) stays read-only to it. The empty line resets
# agent/vox-agent.service's list before the one path is set.
[Service]
ReadWritePaths=
ReadWritePaths=/var/cache/fusionpbx
